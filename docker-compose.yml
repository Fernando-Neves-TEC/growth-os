services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: growthos-postgres
    environment:
      POSTGRES_USER: growthos
      POSTGRES_PASSWORD: growthos
      POSTGRES_DB: growthos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: growthos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: growthos-temporal
    depends_on:
      - postgres
    environment:
      - DB=postgres12_pgx
      - DB_PORT=5432
      - POSTGRES_USER=growthos
      - POSTGRES_PWD=growthos
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233" # frontend (gRPC)
      - "8233:8233" # UI

  temporal-ui:
    image: temporalio/ui:2.53.2
    container_name: growthos-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  pgdata:
