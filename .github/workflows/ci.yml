name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@growthos/core
      - run: npm test --workspace=@growthos/core

  ts-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@growthos/api
      - run: npm run build --workspace=@growthos/temporal-worker
      - run: npm test --workspace=@growthos/api # e2e herméticos; integração DB pula sem banco

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@growthos/web

  python-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r workers/python/requirements-dev.txt
      - run: python -m pytest workers/python/tests -q

